name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ github.ref }}" -ne "refs/heads/main") {
              throw "Manual package publishing must run from main."
            }
            $mainSha = (git rev-parse origin/main).Trim()
            if ($env:GITHUB_SHA -ne $mainSha) {
              throw "Manual package publishing must run from the exact current main commit."
            }
          }
          else {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Tagged commit '$env:GITHUB_SHA' is not contained in current main history."
            }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release version
        shell: pwsh
        run: |
          $version = [string]([xml](Get-Content "src/Flamoris.Logging/Flamoris.Logging.csproj")).Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Missing package version in Flamoris.Logging.csproj."
          }
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            $expected = "v" + $version
            if ($tag -ne $expected) {
              throw "Tag '$tag' does not match package version '$expected'."
            }
          }
          else {
            Write-Host "Manual publish of Flamoris.Logging $version from current main."
          }

      - run: dotnet restore Flamoris.Logging.slnx
      - run: dotnet build Flamoris.Logging.slnx --configuration Release --no-restore
      - run: dotnet test Flamoris.Logging.slnx --configuration Release --no-build
      - run: dotnet pack src/Flamoris.Logging/Flamoris.Logging.csproj --configuration Release --no-build --output artifacts/packages

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget
        with:
          user: akino-nanto

      - name: Publish to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          $package = Get-ChildItem "artifacts/packages/Flamoris.Logging.*.nupkg" |
            Where-Object { $_.Name -notlike "*.snupkg" } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "Expected Flamoris.Logging package was not produced."
          }
          dotnet nuget push $package.FullName `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key $env:NUGET_API_KEY

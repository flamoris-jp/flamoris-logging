name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is reviewed main history
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit '$env:GITHUB_SHA' is not contained in current main history."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/flamoris-jp/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "v" + ([xml](Get-Content "src/Flamoris.Logging/Flamoris.Logging.csproj")).Project.PropertyGroup.Version
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match package version '$expected'."
          }

      - run: dotnet restore Flamoris.Logging.slnx
      - run: dotnet build Flamoris.Logging.slnx --configuration Release --no-restore
      - run: dotnet test Flamoris.Logging.slnx --configuration Release --no-build
      - run: dotnet pack src/Flamoris.Logging/Flamoris.Logging.csproj --configuration Release --no-build --output artifacts/packages

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = Get-ChildItem "artifacts/packages/Flamoris.Logging.*.nupkg" |
            Where-Object { $_.Name -notlike "*.snupkg" } |
            Select-Object -First 1
          dotnet nuget push $package.FullName `
            --source "https://nuget.pkg.github.com/flamoris-jp/index.json" `
            --api-key $env:GITHUB_TOKEN

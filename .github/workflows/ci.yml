name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Flamoris.Logging.slnx
      - run: dotnet build Flamoris.Logging.slnx --configuration Release --no-restore
      - run: dotnet test Flamoris.Logging.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: TestResults
          retention-days: 3
